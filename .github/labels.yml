# Canonical label definitions for nayuengin/restic-tray
# Synchronized by .github/workflows/labels.yml (crazy-max/ghaction-github-labeler)

# --- Problem ---
- name: "Problem: Bug"
  color: "#d73a4a"
  description: "不具合や想定外の挙動に関する報告・修正"
- name: "Problem: Performance"
  color: "#e5534b"
  description: "性能劣化・CPU消費・メモリ使用量に関する問題"
- name: "Problem: Security"
  color: "#b60205"
  description: "セキュリティ強化・脆弱性対応・信頼境界の変更"

# --- Feedback ---
- name: "Feedback: Feature Request"
  color: "#ff9900"
  description: "新機能や既存機能の改善要望"
- name: "Feedback: Question"
  color: "#f5a623"
  description: "使い方・設定・設計に関する質問"
- name: "Feedback: Discussion"
  color: "#e67e22"
  description: "設計や方針の議論・検討が必要な課題"

# --- Scope ---
- name: "Scope: GUI"
  color: "#0e8a16"
  description: "GUI（eframe/egui）・テーマ・トレイ・通知・ウィンドウ"
- name: "Scope: MCP"
  color: "#0e8a16"
  description: "内蔵 MCP サーバー（--mcp）・名前付きパイプ・プロトコル"
- name: "Scope: Restic"
  color: "#0e8a16"
  description: "Restic 実行・除外設定・R2 S3・DPAPI・パス安全・同期"
- name: "Scope: Scheduler"
  color: "#0e8a16"
  description: "定期スケジューラ・未実施アラート・SQLite 履歴・設定"
- name: "Scope: Packaging"
  color: "#0e8a16"
  description: "インストーラ（NSIS/MSI）・ZIP・リリーススクリプト・アセット"

# --- Priority ---
- name: "Priority: Critical"
  color: "#b60205"
  description: "脆弱性・データ損失リスク・全ユーザーに影響する障害"
- name: "Priority: High"
  color: "#d93f0b"
  description: "主要なバックアップ・復元機能に影響する重大な不具合"
- name: "Priority: Medium"
  color: "#fbca04"
  description: "通常の不具合修正や採用済みの機能改善"
- name: "Priority: Low"
  color: "#c2e0c6"
  description: "軽微な改善・あると便利な機能・影響の小さいエッジケース"

# --- Status ---
- name: "Status: Triage"
  color: "#d4d4d8"
  description: "初期分類待ちの新規 Issue"
- name: "Status: Needs Info"
  color: "#fef2c0"
  description: "再現手順・ログ・補足情報の回答待ち"
- name: "Status: Needs Human"
  color: "#e11d48"
  description: "オーナー（@nayuengin）の確認・判断が必要"
- name: "Status: Ready"
  color: "#2da44e"
  description: "分類・範囲確定済みで実装着手可能"
- name: "Status: In Progress"
  color: "#fbca04"
  description: "実装・調査の作業中"
- name: "Status: In Review"
  color: "#5319e7"
  description: "レビュー中の Issue / PR"
- name: "Status: Blocked"
  color: "#e99695"
  description: "外部依存・別 Issue・判断待ちで保留中"
- name: "Status: Done"
  color: "#0e8a16"
  description: "完了済みの Issue / PR"

# --- PR ---
- name: "PR: CI/Build"
  color: "#1d76db"
  description: "CI・ワークフロー・ビルド設定・保守に関する変更"
- name: "PR: Dependencies"
  color: "#0366d6"
  description: "Cargo・GitHub Actions・同梱 restic の依存更新"
- name: "PR: Documentation"
  color: "#bfdadc"
  description: "ドキュメント・README・コメントの更新"
- name: "PR: Refactor"
  color: "#c5def5"
  description: "挙動を変えないリファクタリング・コード整理"
- name: "PR: AI Authored"
  color: "#6e56cf"
  description: "AI ツール・エージェントが作成または主要生成した PR"
- name: "PR: AI Reviewed"
  color: "#bfd4f2"
  description: "AI メンテナによるレビューが完了した PR"

# --- Close ---
- name: "Close: Duplicate"
  color: "#333333"
  description: "既存の Issue や PR と重複"
- name: "Close: Invalid"
  color: "#333333"
  description: "誤報・前提誤り・再現不能などで無効"
- name: "Close: Wontfix"
  color: "#333333"
  description: "スコープ外または対応しない方針"

# --- Community ---
- name: "Community: Good First Issue"
  color: "#008672"
  description: "初めてのコントリビューター向けで範囲が明確な課題"
- name: "Community: Help Wanted"
  color: "#0d9488"
  description: "外部コントリビューターからの協力を歓迎する課題"
