name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  pull_request:
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview label changes without applying them"
        type: boolean
        default: false
      prune_unmanaged:
        description: "Delete repository labels not listed in .github/labels.yml"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Preview Label Sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout label config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          persist-credentials: false

      - name: Preview label changes (dry run)
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: true

  sync:
    name: Sync Repository Labels
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout label config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml
          persist-credentials: false

      - name: Sync labels from .github/labels.yml
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: ${{ github.event_name == 'workflow_dispatch' && !inputs.prune_unmanaged }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
