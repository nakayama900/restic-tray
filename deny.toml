# cargo-deny configuration

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # chrono is marked unmaintained (not a security vulnerability); migration to jiff/time is tracked separately.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice; not a security vulnerability" },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    # Bundled default fonts in epaint_default_fonts (eframe default_fonts feature)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla root certificate bundle in webpki-root-certs (via ureq)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
