[package]
name = "restic-tray"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Periodic backup Windows system tray app using Restic for Cloudflare R2, with built-in MCP server"
license = "MIT"
publish = false

[lib]
name = "restic_tray"
path = "src/lib.rs"

[[bin]]
name = "restic-tray"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
dunce = "1"
# glow as before: eframe's default renderer became wgpu, which this app has no use for.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links"] }
egui = "0.37"
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
# Pure-Rust Pkl evaluator used to read config.pkl; network/package imports disabled.
pklr = { version = "6", default-features = false, features = ["native-io"] }
md-5 = "0.11"
open = "5.3"
quick-xml = "0.41"
rand = "0.10"
rfd = "0.18"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.26"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Same version eframe already pulls in, for toast notifications through its safe WinRT API.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
